name: ✨ Feature request
description: Suggest a new feature or an improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe it as clearly as you can.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: e.g. I always have to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen? Describe how it should look and behave.
      placeholder: A clear description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other solutions or workarounds you have tried?
      placeholder: Optional

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, mockups, links — anything that helps explain the idea.
      placeholder: Optional
