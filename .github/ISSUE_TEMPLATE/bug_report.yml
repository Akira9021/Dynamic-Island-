name: 🐛 Bug report
description: Report something that is broken or not working as expected
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen instead?
      placeholder: A clear and concise description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See the problem
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Which version are you using?
      placeholder: e.g. 1.6.5
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Which phone or tablet?
      placeholder: e.g. Samsung Galaxy S24, Xiaomi 14, Pixel 8
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Android version and OS (stock, MIUI, HyperOS, One UI, ColorOS...)?
      placeholder: e.g. Android 14, HyperOS 1.0
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag and drop screenshots or a screen recording here if it helps
      placeholder: Attach media here

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else we should know?
      placeholder: Logs, workarounds, when the bug started...
